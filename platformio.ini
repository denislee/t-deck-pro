; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]

; Pick the sketch with `make build SRC_DIR=examples/<name>` (or edit src_dir below). Sketches: factory,
; tethering (env T-Deck-Pro-modem), A7682E/{test_AT,deep_sleep,audio_test}, bq27220, bq25896_shutdown,
; test_BHI260AP, test_EPD, test_GPS, test_keypad, test_lora_recv, test_lora_send, test_LTR_553ALS, test_lvgl,
; test_pcm5102a, test_sd, test_touchpad, test_wifi, WireScan, touch_hyn_core/arduino.
; A7682E sketches need the battery plugged in.

src_dir = examples/factory

boards_dir = boards
default_envs = T-Deck-Pro

; Settings shared by every env. Envs may override or extend these.
[env]
board = T-Deck-Pro
framework = arduino
upload_speed = 921600
monitor_speed = 115200
; Single 2.5 MB app slot + ~13.4 MB SPIFFS, replacing the board's stock
; default_16MB.csv (two dead 6.5 MB OTA slots). See partitions_tdeckpro.csv.
board_build.partitions = partitions_tdeckpro.csv

[env:T-Deck-Pro]

platform = espressif32@6.5.0
; monitor_filters = esp32_exception_decoder

build_flags = 
    -DBOARD_HAS_PSRAM

    ; ARDUINO_USB_CDC_ON_BOOT=1 waits for a terminal at boot; set 0 to not block on battery.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCONFIG_TINYUSB_MSC_ENABLED=1

    ; LVGL config
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_INCLUDE_SIMPLE
    -include config/lv_conf.h

    ;  -DLOG_PORT=Serial

    ; Debug output
    ; CORE_DEBUG_LEVEL=0 silences Arduino-ESP32 log_e/log_w/log_i across all
    ; vendored libs. Set to 1 (error) or higher when investigating new issues —
    ; was dropped from 1 because the intermittent TCA8418 on this V1.1 board
    ; spams Wire.cpp:499 "Error 263" once or twice per second indefinitely.
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_DIAGNOSTIC_OUTPUT=1

lib_deps =
    ; third-party libs are vendored under lib/
    SPI
    Wire
    FS
    SPIFFS
    EEPROM

; =============================================================================
;  Tethering env: A7682E (4G) -> WiFi softAP bridge.
;  - Uses the pioarduino fork to get Arduino-ESP32 3.x (PPP class, NAPT helpers).
;    The official platformio/espressif32 repo stalled at the 2.x core, which
;    does NOT have <PPP.h>.
;  - DO NOT use this env for the factory firmware; the 3.x core has breaking
;    changes for LVGL/GxEPD2/SensorLib that are not yet patched in this repo.
;  - Invoked by `make upload-modem`, which also sets PLATFORMIO_SRC_DIR to
;    examples/tethering so the default factory build is unaffected.
; =============================================================================
[env:T-Deck-Pro-modem]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
build_flags =
    -DBOARD_HAS_PSRAM
    ; ARDUINO_USB_CDC_ON_BOOT=1 waits for a terminal at boot; set 0 to not block on battery.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    SPI
    Wire
    FS
